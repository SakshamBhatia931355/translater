<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Japanese Practice · Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">JAPANESE PRACTICE</p>
    <h1>Enter your access code</h1>
    <p class="hint">Use the code displayed on the PC that started this practice link.</p>
    {% if message %}<p class="login-error" role="alert">{{ message }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="code">Access code</label>
      <input id="code" name="code" class="text-input" inputmode="numeric" autocomplete="one-time-code" required autofocus>
      <button class="button primary" type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
